VERSION: 2.0.2
METHOD:
  ID: podcasts.byguid.list
  SUMMARY: By GUID
  CANONICAL_ID: podcasts.byguid.list
  DESC: |
    This call returns everything we know about the feed from the feed's GUID.

    The GUID is a unique, global identifier for the podcast. See the namespace spec for
    [guid](https://github.com/Podcastindex-org/podcast-namespace/blob/main/docs/1.0.md#guid) for details.

    Examples:

      - https://api.podcastindex.org/api/1.0/podcasts/byguid?guid=9b024349-ccf0-5f69-a609-6b82873eab3c&pretty
      - Includes `value` and `funding`: https://api.podcastindex.org/api/1.0/podcasts/byguid?guid=9b024349-ccf0-5f69-a609-6b82873eab3c&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /podcasts/byguid
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: guid
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(podcasts.byguid.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  podcasts.byguid.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: query
      type: STRUCT(query_guid)
      REQUIRED: false
    - name: feed
      type: STRUCT(feed_podcast)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  query_guid:
    - name: guid
      type: STRING
      REQUIRED: false
    - name: id
      type: STRING
      REQUIRED: false
  feed_podcast:
    - name: id
      type: INT
      REQUIRED: false
    - name: podcastGuid
      type: STRING
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
    - name: originalUrl
      type: STRING
      REQUIRED: false
    - name: link
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
    - name: author
      type: STRING
      REQUIRED: false
    - name: ownerName
      type: STRING
      REQUIRED: false
    - name: image
      type: STRING
      REQUIRED: false
    - name: artwork
      type: STRING
      REQUIRED: false
    - name: lastUpdateTime
      type: INT
      REQUIRED: false
    - name: lastCrawlTime
      type: INT
      REQUIRED: false
    - name: lastParseTime
      type: INT
      REQUIRED: false
    - name: lastGoodHttpStatusTime
      type: INT
      REQUIRED: false
    - name: lastHttpStatus
      type: INT
      REQUIRED: false
    - name: contentType
      type: STRING
      REQUIRED: false
    - name: itunesId
      type: INT
      REQUIRED: false
    - name: itunesType
      type: STRING
      REQUIRED: false
    - name: generator
      type: STRING
      REQUIRED: false
    - name: language
      type: STRING
      REQUIRED: false
    - name: explicit
      type: BOOL
      REQUIRED: false
    - name: type
      type: INT
      REQUIRED: false
    - name: medium
      type: STRING
      REQUIRED: false
    - name: dead
      type: INT
      REQUIRED: false
    - name: chash
      type: STRING
      REQUIRED: false
    - name: episodeCount
      type: INT
      REQUIRED: false
    - name: crawlErrors
      type: INT
      REQUIRED: false
    - name: parseErrors
      type: INT
      REQUIRED: false
    - name: categories
      type: STRUCT(categories)
      REQUIRED: false
    - name: locked
      type: INT
      REQUIRED: false
    - name: imageUrlHash
      type: INT
      REQUIRED: false
    - name: value
      type: STRUCT(value)
      REQUIRED: false
    - name: funding
      type: STRUCT(funding)
      REQUIRED: false
  value:
    - name: model
      type: STRUCT(model_v4v)
      REQUIRED: false
    - name: destinations
      type: ANY
      REQUIRED: false
  model_v4v:
    - name: type
      type: STRING
      REQUIRED: false
    - name: method
      type: STRING
      REQUIRED: false
    - name: suggested
      type: STRING
      REQUIRED: false
  funding:
    - name: url
      type: STRING
      REQUIRED: false
    - name: message
      type: STRING
      REQUIRED: false
