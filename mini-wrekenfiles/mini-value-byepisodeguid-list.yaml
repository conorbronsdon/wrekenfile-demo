VERSION: 2.0.2
METHOD:
  ID: value.byepisodeguid.list
  SUMMARY: By Episode GUID
  CANONICAL_ID: value.byepisodeguid.list
  DESC: |
    This call returns the information for supporting the podcast episode via one of the "Value for Value" methods from
    podcast GUID and the episode GUID.

    The `podcastguid` is the GUID from the `podcast:guid` tag in the feed. This value is a unique, global identifier
    for the podcast. See the namespace spec for
    [guid](https://github.com/Podcastindex-org/podcast-namespace/blob/main/docs/1.0.md#guid) for details.

    The `episodeguid` is the unique guid specified for the `<item>` in the feed but may not be globally unique.

    Note: No API key needed for this endpoint.

    Examples:

      - https://api.podcastindex.org/api/1.0/value/byepisodeguid?podcastguid=917393e3-1b1e-5cef-ace4-edaa54e1f810&episodeguid=PC20143&pretty
      - https://api.podcastindex.org/api/1.0/value/byepisodeguid?podcastguid=c73b1a23-1c28-5edb-94c3-10d1745d0877&episodeguid=bdea6759-a7b6-4c0d-9d1e-acca3133f4a9&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /value/byepisodeguid
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS: {}
INPUTS:
  - name: podcastguid
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: episodeguid
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(value.byepisodeguid.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRING
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  value.byepisodeguid.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: query
      type: STRUCT(query_byepisodeguid)
      REQUIRED: false
    - name: value
      type: STRUCT(value_byepisodeguid)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  query_byepisodeguid:
    - name: podcastguid
      type: STRING
      REQUIRED: false
    - name: episodeguid
      type: STRING
      REQUIRED: false
  value_byepisodeguid:
    - name: model
      type: STRUCT(model_v4v)
      REQUIRED: false
    - name: destinations
      type: ANY
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
    - name: feedTitle
      type: STRING
      REQUIRED: false
  model_v4v:
    - name: type
      type: STRING
      REQUIRED: false
    - name: method
      type: STRING
      REQUIRED: false
    - name: suggested
      type: STRING
      REQUIRED: false
  Error400:
    - name: status
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
