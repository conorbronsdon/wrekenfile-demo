VERSION: 2.0.2
METHOD:
  ID: static.stat.v4vmusic.json.list
  SUMMARY: v4v Music Chart JSON
  CANONICAL_ID: static.stat.v4vmusic.json.list
  DESC: |
    Contains the ranking of the music tracks played on podcasts that have been boosted the most over the last 7 days.

    Each entry shows the number of listener boosts sent over this time period. The chart is updated hourly.

    Can be viewed in a browser at https://podcastindex.top/ (https://stats.podcastindex.org/v4vmusic.html).

    View at: https://stats.podcastindex.org/v4vmusic.json

    Also available in [OPML](#get-/static/stats/v4vmusic.opml) and [RSS](#get-/static/stats/v4vmusic.rss).
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /static/stats/v4vmusic.json
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS: {}
RETURNS:
  TYPE: STRUCT(static.stat.v4vmusic.json.listResponse200)
ERRORS:
  - TYPE: ANY
    WHEN: Invalid request (HTTP 400)
  - TYPE: ANY
    WHEN: Not found (HTTP 404)
STRUCTS:
  static.stat.v4vmusic.json.listResponse200:
    - name: title
      type: STRING
      REQUIRED: false
      comment: Title of music
    - name: description
      type: STRING
      REQUIRED: false
      comment: Description of object
    - name: timestamp
      type: INT
      REQUIRED: false
      comment: Date updated
    - name: items
      type: OBJECT
      REQUIRED: false
      comment: Array of top X music feeds
