VERSION: 2.0.2
METHOD:
  ID: podcasts.batch.byguid.create
  SUMMARY: Batch By Feed GUID
  CANONICAL_ID: podcasts.batch.byguid.create
  DESC: |
    This call returns everything we know about the feed from the feed's GUID provided in JSON array in the body of the request.

    The GUID is a unique, global identifier for the podcast. See the namespace spec for
    [guid](https://github.com/Podcastindex-org/podcast-namespace/blob/main/docs/1.0.md#guid) for details.
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: POST
  ENDPOINT: /podcasts/batch/byguid
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    Content-Type: application/json
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: body
    TYPE: ANY
    REQUIRED: true
    LOCATION: body
RETURNS:
  TYPE: STRUCT(podcasts.batch.byguid.createResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  podcasts.batch.byguid.createResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: allFound
      type: BOOL
      REQUIRED: false
    - name: found
      type: INT
      REQUIRED: false
    - name: feeds
      type: ANY
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
