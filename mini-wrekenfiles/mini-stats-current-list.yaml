VERSION: 2.0.2
METHOD:
  ID: stats.current.list
  SUMMARY: Current
  CANONICAL_ID: stats.current.list
  DESC: |
    Return the most recent index statistics.

    Hourly statistics can also be access at https://stats.podcastindex.org/hourly_counts.json
    For details, see [Stats Hourly Counts](#get-/static/stats/hourly_counts.json).

    Daily statistics can also be access at https://stats.podcastindex.org/daily_counts.json.
    For details, see [Stats Daily Counts](#get-/static/stats/daily_counts.json).

    Example: https://api.podcastindex.org/api/1.0/stats/current?pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /stats/current
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(stats.current.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  stats.current.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: stats
      type: STRUCT(stats)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  stats:
    - name: feedCountTotal
      type: INT
      REQUIRED: false
    - name: episodeCountTotal
      type: INT
      REQUIRED: false
    - name: feedsWithNewEpisodes3days
      type: INT
      REQUIRED: false
    - name: feedsWithNewEpisodes10days
      type: INT
      REQUIRED: false
    - name: feedsWithNewEpisodes30days
      type: INT
      REQUIRED: false
    - name: feedsWithNewEpisodes90days
      type: INT
      REQUIRED: false
    - name: feedsWithValueBlocks
      type: INT
      REQUIRED: false
