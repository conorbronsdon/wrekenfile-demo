VERSION: 2.0.2
METHOD:
  ID: search.search.list
  SUMMARY: Search
  CANONICAL_ID: search.search.list
  DESC: |
    Replaces the Apple search API but returns data from the Podcast Index database.

    Note: No API key needed for this endpoint.

    Example:

      - Apple: https://itunes.apple.com/search?media=podcast&entity=podcast&term=batman
      - PodcastIndex: https://api.podcastindex.org/search?term=batman
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /search
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS: {}
INPUTS:
  - name: term
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(search.search.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  search.search.listResponse200:
    - name: resultCount
      type: INT
      REQUIRED: false
    - name: results
      type: ANY
      REQUIRED: false
