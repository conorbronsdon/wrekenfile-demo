VERSION: 2.0.2
METHOD:
  ID: episodes.byid.list
  SUMMARY: By ID
  CANONICAL_ID: episodes.byid.list
  DESC: |
    Get all the metadata for a single episode by passing its id.

    Example: https://api.podcastindex.org/api/1.0/episodes/byid?id=16795090&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /episodes/byid
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: id
    TYPE: INT
    REQUIRED: true
    LOCATION: query
  - name: fulltext
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(episodes.byid.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRING
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  episodes.byid.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: id
      type: INT
      REQUIRED: false
    - name: episode
      type: STRUCT(episode_object)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  episode_object:
    - name: id
      type: INT
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
    - name: link
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
    - name: guid
      type: STRING
      REQUIRED: false
    - name: datePublished
      type: INT
      REQUIRED: false
    - name: datePublishedPretty
      type: STRING
      REQUIRED: false
    - name: dateCrawled
      type: INT
      REQUIRED: false
    - name: enclosureUrl
      type: STRING
      REQUIRED: false
    - name: enclosureType
      type: STRING
      REQUIRED: false
    - name: enclosureLength
      type: INT
      REQUIRED: false
    - name: duration
      type: INT
      REQUIRED: false
    - name: explicit
      type: INT
      REQUIRED: false
    - name: episode
      type: INT
      REQUIRED: false
    - name: episodeType
      type: STRING
      REQUIRED: false
    - name: season
      type: INT
      REQUIRED: false
    - name: image
      type: STRING
      REQUIRED: false
    - name: imageUrlHash
      type: INT
      REQUIRED: false
    - name: feedItunesId
      type: INT
      REQUIRED: false
    - name: feedImage
      type: STRING
      REQUIRED: false
    - name: feedImageUrlHash
      type: INT
      REQUIRED: false
    - name: feedId
      type: INT
      REQUIRED: false
    - name: feedTitle
      type: STRING
      REQUIRED: false
    - name: feedLanguage
      type: STRING
      REQUIRED: false
    - name: chaptersUrl
      type: STRING
      REQUIRED: false
    - name: transcripts
      type: ANY
      REQUIRED: false
    - name: persons
      type: ANY
      REQUIRED: false
    - name: socialInteract
      type: ANY
      REQUIRED: false
    - name: value
      type: STRUCT(value)
      REQUIRED: false
    - name: soundbite
      type: STRUCT(soundbite)
      REQUIRED: false
    - name: soundbites
      type: ANY
      REQUIRED: false
  value:
    - name: model
      type: STRUCT(model_v4v)
      REQUIRED: false
    - name: destinations
      type: ANY
      REQUIRED: false
  model_v4v:
    - name: type
      type: STRING
      REQUIRED: false
    - name: method
      type: STRING
      REQUIRED: false
    - name: suggested
      type: STRING
      REQUIRED: false
  soundbite:
    - name: startTime
      type: INT
      REQUIRED: false
    - name: duration
      type: INT
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
  Error400:
    - name: status
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
