VERSION: 2.0.2
METHOD:
  ID: episodes.live.list
  SUMMARY: Live
  CANONICAL_ID: episodes.live.list
  DESC: |
    Get all episodes that have been found in the [podcast:liveitem](https://github.com/Podcastindex-org/podcast-namespace/blob/main/docs/1.0.md#live-item) from the feeds.

    Examples:

      - https://api.podcastindex.org/api/1.0/episodes/live?pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /episodes/live
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: max
    TYPE: INT
    REQUIRED: false
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(episodes.live.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  episodes.live.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: items
      type: ANY
      REQUIRED: false
    - name: count
      type: INT
      REQUIRED: false
    - name: max
      type: INT
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
