VERSION: 2.0.2
METHOD:
  ID: episodes.byfeedurl.list
  SUMMARY: By Feed URL
  CANONICAL_ID: episodes.byfeedurl.list
  DESC: |
    This call returns all the episodes we know about for this feed from the feed URL.
    Episodes are in reverse chronological order.

    Examples:

      - https://api.podcastindex.org/api/1.0/episodes/byfeedurl?url=https://feeds.theincomparable.com/batmanuniversity&pretty
      - Includes `persons`: https://api.podcastindex.org/api/1.0/episodes/byfeedurl?url=https://engineered.network/pragmatic/feed/index.xml&pretty
      - Includes `value`: https://api.podcastindex.org/api/1.0/episodes/byfeedurl?url=https://closing-the-loop.github.io/feed.xml&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /episodes/byfeedurl
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: url
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: since
    TYPE: INT
    REQUIRED: false
    LOCATION: query
  - name: max
    TYPE: INT
    REQUIRED: false
    LOCATION: query
  - name: fulltext
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(episodes.byfeedurl.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  episodes.byfeedurl.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: items
      type: ANY
      REQUIRED: false
    - name: count
      type: INT
      REQUIRED: false
    - name: query
      type: STRUCT(query_url)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  query_url:
    - name: url
      type: STRING
      REQUIRED: false
