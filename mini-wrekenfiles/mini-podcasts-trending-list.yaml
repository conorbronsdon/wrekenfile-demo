VERSION: 2.0.2
METHOD:
  ID: podcasts.trending.list
  SUMMARY: Trending
  CANONICAL_ID: podcasts.trending.list
  DESC: |
    This call returns the podcasts/feeds that in the index that are trending.

    Example: https://api.podcastindex.org/api/1.0/podcasts/trending?pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /podcasts/trending
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: max
    TYPE: INT
    REQUIRED: false
    LOCATION: query
  - name: since
    TYPE: INT
    REQUIRED: false
    LOCATION: query
  - name: lang
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: cat
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: notcat
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(podcasts.trending.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  podcasts.trending.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: feeds
      type: ANY
      REQUIRED: false
    - name: count
      type: INT
      REQUIRED: false
    - name: max
      type: INT
      REQUIRED: false
    - name: since
      type: INT
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
