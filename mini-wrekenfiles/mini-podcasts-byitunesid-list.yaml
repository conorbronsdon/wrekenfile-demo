VERSION: 2.0.2
METHOD:
  ID: podcasts.byitunesid.list
  SUMMARY: By iTunes ID
  CANONICAL_ID: podcasts.byitunesid.list
  DESC: |
    This call returns everything we know about the feed from the iTunes ID

    Example: https://api.podcastindex.org/api/1.0/podcasts/byitunesid?id=1441923632&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /podcasts/byitunesid
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: id
    TYPE: INT
    REQUIRED: true
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(podcasts.byitunesid.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRING
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  podcasts.byitunesid.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: query
      type: STRUCT(query_id)
      REQUIRED: false
    - name: feed
      type: STRUCT(feed_itunes)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  query_id:
    - name: id
      type: STRING
      REQUIRED: false
  feed_itunes:
    - name: id
      type: INT
      REQUIRED: false
    - name: podcastGuid
      type: STRING
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
    - name: originalUrl
      type: STRING
      REQUIRED: false
    - name: link
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
    - name: author
      type: STRING
      REQUIRED: false
    - name: ownerName
      type: STRING
      REQUIRED: false
    - name: image
      type: STRING
      REQUIRED: false
    - name: artwork
      type: STRING
      REQUIRED: false
    - name: lastUpdateTime
      type: INT
      REQUIRED: false
    - name: lastCrawlTime
      type: INT
      REQUIRED: false
    - name: lastParseTime
      type: INT
      REQUIRED: false
    - name: lastGoodHttpStatusTime
      type: INT
      REQUIRED: false
    - name: lastHttpStatus
      type: INT
      REQUIRED: false
    - name: contentType
      type: STRING
      REQUIRED: false
    - name: itunesId
      type: INT
      REQUIRED: false
    - name: generator
      type: STRING
      REQUIRED: false
    - name: language
      type: STRING
      REQUIRED: false
    - name: type
      type: INT
      REQUIRED: false
    - name: dead
      type: INT
      REQUIRED: false
    - name: episodeCount
      type: INT
      REQUIRED: false
    - name: crawlErrors
      type: INT
      REQUIRED: false
    - name: parseErrors
      type: INT
      REQUIRED: false
    - name: categories
      type: OBJECT
      REQUIRED: false
    - name: locked
      type: INT
      REQUIRED: false
    - name: funding
      type: STRUCT(funding)
      REQUIRED: false
  funding:
    - name: url
      type: STRING
      REQUIRED: false
    - name: message
      type: STRING
      REQUIRED: false
  Error400:
    - name: status
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
