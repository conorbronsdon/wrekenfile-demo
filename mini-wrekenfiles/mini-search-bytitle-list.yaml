VERSION: 2.0.2
METHOD:
  ID: search.bytitle.list
  SUMMARY: Search Podcasts by Title
  CANONICAL_ID: search.bytitle.list
  DESC: |
    This call returns all of the feeds where the `title` of the feed matches the search term (ignores case).

    Example "everything everywhere daily" will match the podcast
    [Everything Everywhere Daily](https://podcastindex.org/podcast/437685) by "everything everywhere" will not.

    Example: https://api.podcastindex.org/api/1.0/search/bytitle?q=everything+everywhere+daily&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /search/bytitle
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: q
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: val
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: max
    TYPE: INT
    REQUIRED: false
    LOCATION: query
  - name: clean
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: fulltext
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: similar
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(search.bytitle.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRUCT(Error401)
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  search.bytitle.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: feeds
      type: ANY
      REQUIRED: false
    - name: count
      type: INT
      REQUIRED: false
    - name: query
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
