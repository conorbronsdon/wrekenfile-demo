VERSION: 2.0.2
METHOD:
  ID: static.tracking.current.list
  SUMMARY: Current
  CANONICAL_ID: static.tracking.current.list
  DESC: |
    This call returns every new feed and episode added to the index over the past 24 hours in reverse chronological order.

    This is similar to `/recent/feeds` but uses the date the feed was found by the index rather than the feed's
    internal timestamp.

    Similar data can also be retrieved using the API endpoint [recent/data](#get-/recent/data).

    Access at: https://tracking.podcastindex.org/current

    The prior 24 hours of data (going backwards until all tracked data is received) can be accessed using the timestamp
    of the previous data set. This is found in the `previousTrackingUrl`.
    The format of these prior data sets follows the format described below.
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /static/tracking/current
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS: {}
RETURNS:
  TYPE: STRUCT(static.tracking.current.listResponse200)
ERRORS:
  - TYPE: ANY
    WHEN: Invalid request (HTTP 400)
  - TYPE: ANY
    WHEN: Not found (HTTP 404)
STRUCTS:
  static.tracking.current.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: feedCount
      type: INT
      REQUIRED: false
    - name: itemCount
      type: INT
      REQUIRED: false
    - name: max
      type: INT
      REQUIRED: false
    - name: since
      type: INT
      REQUIRED: false
    - name: previousTrackingUrl
      type: STRING
      REQUIRED: false
      comment: URL to previous set of data
    - name: data
      type: STRUCT(data_static)
      REQUIRED: false
  data_static:
    - name: nextSince
      type: INT
      REQUIRED: false
      comment: |
        Value of `since` in next block of data
    - name: position
      type: INT
      REQUIRED: false
    - name: feeds
      type: ANY
      REQUIRED: false
    - name: items
      type: ANY
      REQUIRED: false
