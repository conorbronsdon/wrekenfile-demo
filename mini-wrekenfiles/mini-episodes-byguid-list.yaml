VERSION: 2.0.2
METHOD:
  ID: episodes.byguid.list
  SUMMARY: By GUID
  CANONICAL_ID: episodes.byguid.list
  DESC: |
    Get all the metadata for a single episode by passing its guid and the feed id or URL.

    The `feedid`, `feedurl`, or `podcastguid` is required.

    Examples:

      - Search using Podcast Index feed ID: https://api.podcastindex.org/api/1.0/episodes/byguid?guid=PC2084&feedid=920666&pretty
      - Search using feed URL: https://api.podcastindex.org/api/1.0/episodes/byguid?guid=PC2084&feedurl=http://mp3s.nashownotes.com/pc20rss.xml&pretty
EXECUTION:
  KIND: http
  MODE: sync
  EXECUTION_LEVEL: standalone
HTTP:
  METHOD: GET
  ENDPOINT: /episodes/byguid
  CONTENT_TYPE: application/json
  ACCEPT: application/json
  HEADERS:
    X-Auth-Key: x-auth-key
    User-Agent: user-agent
    X-Auth-Date: x-auth-date
    Authorization: authorization
INPUTS:
  - name: guid
    TYPE: STRING
    REQUIRED: true
    LOCATION: query
  - name: feedurl
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: feedid
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: podcastguid
    TYPE: STRING
    REQUIRED: false
    LOCATION: query
  - name: fulltext
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
  - name: pretty
    TYPE: BOOL
    REQUIRED: false
    LOCATION: query
RETURNS:
  TYPE: STRUCT(episodes.byguid.listResponse200)
ERRORS:
  - TYPE: STRUCT(Error400)
    WHEN: Invalid request (HTTP 400)
  - TYPE: STRING
    WHEN: Not authenticated (HTTP 401)
STRUCTS:
  episodes.byguid.listResponse200:
    - name: status
      type: STRING
      REQUIRED: false
    - name: id
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
    - name: podcastGuid
      type: STRING
      REQUIRED: false
    - name: guid
      type: STRING
      REQUIRED: false
    - name: episode
      type: STRUCT(episode_object)
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
  episode_object:
    - name: id
      type: INT
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
    - name: link
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
    - name: guid
      type: STRING
      REQUIRED: false
    - name: datePublished
      type: INT
      REQUIRED: false
    - name: datePublishedPretty
      type: STRING
      REQUIRED: false
    - name: dateCrawled
      type: INT
      REQUIRED: false
    - name: enclosureUrl
      type: STRING
      REQUIRED: false
    - name: enclosureType
      type: STRING
      REQUIRED: false
    - name: enclosureLength
      type: INT
      REQUIRED: false
    - name: duration
      type: INT
      REQUIRED: false
    - name: explicit
      type: INT
      REQUIRED: false
    - name: episode
      type: INT
      REQUIRED: false
    - name: episodeType
      type: STRING
      REQUIRED: false
    - name: season
      type: INT
      REQUIRED: false
    - name: image
      type: STRING
      REQUIRED: false
    - name: imageUrlHash
      type: INT
      REQUIRED: false
    - name: feedItunesId
      type: INT
      REQUIRED: false
    - name: feedImage
      type: STRING
      REQUIRED: false
    - name: feedImageUrlHash
      type: INT
      REQUIRED: false
    - name: feedId
      type: INT
      REQUIRED: false
    - name: feedTitle
      type: STRING
      REQUIRED: false
    - name: feedLanguage
      type: STRING
      REQUIRED: false
    - name: chaptersUrl
      type: STRING
      REQUIRED: false
    - name: transcripts
      type: ANY
      REQUIRED: false
    - name: persons
      type: ANY
      REQUIRED: false
    - name: socialInteract
      type: ANY
      REQUIRED: false
    - name: value
      type: STRUCT(value)
      REQUIRED: false
    - name: soundbite
      type: STRUCT(soundbite)
      REQUIRED: false
    - name: soundbites
      type: ANY
      REQUIRED: false
  value:
    - name: model
      type: STRUCT(model_v4v)
      REQUIRED: false
    - name: destinations
      type: ANY
      REQUIRED: false
  model_v4v:
    - name: type
      type: STRING
      REQUIRED: false
    - name: method
      type: STRING
      REQUIRED: false
    - name: suggested
      type: STRING
      REQUIRED: false
  soundbite:
    - name: startTime
      type: INT
      REQUIRED: false
    - name: duration
      type: INT
      REQUIRED: false
    - name: title
      type: STRING
      REQUIRED: false
  Error400:
    - name: status
      type: STRING
      REQUIRED: false
    - name: description
      type: STRING
      REQUIRED: false
